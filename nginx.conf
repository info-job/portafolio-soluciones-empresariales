# ========================================================
# Configuración NGINX Reverse Proxy para AssetFlow Enterprise
# Ubicación recomendada: /etc/nginx/sites-available/assetflow.conf
# ========================================================

server {
    listen 80;
    server_name activos.empresa.cl; # Reemplazar con el dominio o IP de la empresa
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name activos.empresa.cl; # Reemplazar con el dominio o IP de la empresa

    # Certificados SSL Corporativos (o emitidos por Let's Encrypt / Certbot)
    ssl_certificate /etc/ssl/certs/empresa_cert.crt;
    ssl_certificate_key /etc/ssl/private/empresa_cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaño máximo de subida para documentos, tasaciones y escrituras (50MB)
    client_max_body_size 50M;

    # Compresión gzip para máxima velocidad en redes corporativas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Enrutamiento hacia el backend Node.js / Express en el puerto 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Soporte completo para WebSockets (Live API y streaming bidireccional)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para procesamiento de IA y subida de archivos pesados
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
