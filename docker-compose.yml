services:
  assetflow-db:
    image: postgres:16-alpine
    container_name: assetflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-assetflow_enterprise}
      POSTGRES_USER: ${SQL_USER:-assetflow_admin}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-AssetFlowSecure2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db_partitioned.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-assetflow_admin} -d ${SQL_DB_NAME:-assetflow_enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  assetflow-enterprise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetflow-enterprise
    restart: unless-stopped
    depends_on:
      assetflow-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SQL_HOST=assetflow-db
      - SQL_DB_NAME=${SQL_DB_NAME:-assetflow_enterprise}
      - SQL_USER=${SQL_USER:-assetflow_admin}
      - SQL_PASSWORD=${SQL_PASSWORD:-AssetFlowSecure2026!}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
