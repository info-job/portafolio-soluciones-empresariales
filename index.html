        /* Enterprise Classic Row Palette & Grid Engine */
        .jde-grid {

          border: 1px solid #9DB2C3;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          font-size: 11px;
        }
        .jde-grid th {

          border-right: 1px solid #9DB2C3 !important;
          border-bottom: 1px solid #9DB2C3 !important;

          text-transform: uppercase !important;
          padding: 6px 6px !important;
          letter-spacing: 0.02em;
          text-align: left;
        }
        .jde-qbe-row {
          background-color: #FFFFE1 !important;

          border: 1px solid #A2BCCF !important;
          color: #002D62 !important;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
          font-size: 10.5px !important;
          padding: 2px 4px !important;
          width: 100% !important;
        }
        .jde-qbe-input:focus {
          outline: 1px solid #005B94 !important;
          background-color: #FFFFFF !important;
        }
        .jde-row-even {
          background-color: #F4F8FB !important;
        }
        .jde-row-odd {
          background-color: #FFFFFF !important;
        }
        .jde-row-hover:hover, tr.jde-tr:hover {
          background-color: #FFFFA6 !important;
        }
        .jde-row-selected, tr.jde-tr-selected {
          background-color: #CBE2F3 !important;
          color: #002D62 !important;
        }
        .jde-grid td {
          border-right: 1px solid #D5E1EC !important;
          border-bottom: 1px solid #D5E1EC !important;
          padding: 5px 6px !important;
          color: #1C3D5A;
        }
        .jde-btn {
          background: linear-gradient(180deg, #FFFFFF 0%, #E6EEF6 100%);
          border: 1px solid #9DB2C3;
          color: #002D62;
          font-size: 10.5px;
          font-weight: 600;
          padding: 3px 8px;
          cursor: pointer;
          transition: all 0.15s ease;
          display: inline-flex;
          align-items: center;
          gap: 4px;
        }
        .jde-btn:hover {
          background: linear-gradient(180deg, #F3F7FA 0%, #DCE7F2 100%);

          color: #001B3B;
        }
        .jde-btn:active {
